# Jelly Leon clients — forkregels: basislijn ↔ subtree-commits, geen gitlinks, patchregister, beschermde
# licentiebestanden (tools/clients/check_clients.py), tests van de fork-tooling en actionlint.
# Draait op elke push; ook aanroepbaar voor een syncbranch (input `ref`).
name: Clients / Forkregels

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git-ref om te controleren (bv. een syncbranch); leeg = de ref van de aanroep"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: clients-forkregels-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  forkregels:
    name: Forkregels, tooltests en actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: "Repository ophalen (volledige historie, squashcommits zijn nodig)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: git subtree aanwezig
        run: test -x "$(git --exec-path)/git-subtree"
      - name: Ontwikkelhulpmiddelen (gepind)
        run: python -m pip install --disable-pip-version-check -r tools/clients/requirements-dev.txt
      - name: Ruff
        run: ruff check --config tools/clients/ruff.toml tools/clients
      - name: Tests fork-tooling (nep-upstreams, Sim-getest)
        run: python -m pytest -q tools/clients/tests
      - name: Forkregels op deze ref
        run: python tools/clients/check_clients.py
      - name: Eigen app-identiteit in de bron (JLC-0002/0003/0004)
        run: python tools/clients/app_identiteit.py bron
      - name: actionlint (alleen de fork-eigen workflows in de root)
        run: actionlint -color .github/workflows/*.yml
